<div class="inscription-container">
  <h2>Créer un compte</h2>
  <form id="formInscription" novalidate>
    <div class="form-group">
      <label for="nom">Nom <span class="required">*</span></label>
      <input type="text" id="nom" name="nom" required>
      <small class="error-message">Ce champ est requis.</small>
    </div>

    <div class="form-group">
      <label for="email">Email <span class="required">*</span></label>
      <input type="email" id="email" name="email" required>
      <small class="error-message">Veuillez entrer une adresse email valide.</small>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe <span class="required">*</span></label>
      <input type="password" id="password" name="password" required minlength="6">
      <small class="error-message">Le mot de passe doit contenir au moins 6 caractères.</small>
    </div>

    <div class="form-group">
      <label for="role">Rôle <span class="required">*</span></label>
      <select id="role" name="role" required>
        <option value="">-- Choisir un rôle --</option>
        <option value="passager">Passager</option>
        <option value="conducteur">Conducteur</option>
      </select>
      <small class="error-message">Veuillez choisir un rôle.</small>
    </div>

    <button type="submit">S'inscrire</button>
  </form>
</div>
